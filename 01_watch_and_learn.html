<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorting Visualiser — Watch & Learn</title><style>
:root{--ink:#172033;--muted:#64748b;--paper:#f7f8fb;--panel:#fff;--accent:#635bff;--warn:#f59e0b;--good:#16a34a;--bad:#dc2626;--pivot:#db2777;--border:#dfe3eb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--paper);color:var(--ink)}
header,main{max-width:1180px;margin:auto}header{padding:17px 14px 10px}main{padding:0 14px 18px}
h1{margin:0 0 5px;font-size:clamp(1.5rem,3vw,2.3rem);letter-spacing:-.04em}.sub,.small{color:var(--muted);line-height:1.45}
.panel{background:#fff;border:1px solid var(--border);border-radius:15px;padding:15px;margin-bottom:11px;box-shadow:0 8px 24px rgba(23,32,51,.08)}
.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:end}label{display:grid;gap:4px;font-size:.78rem;font-weight:800;color:var(--muted)}
select,input,button{font:inherit;border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:#fff;color:var(--ink)}
button{cursor:pointer;font-weight:750}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.4}
.board{min-height:205px;display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap;padding:28px 8px 40px}
.card{width:92px;height:120px;border:3px solid var(--accent);border-radius:15px;background:#f0efff;display:grid;place-items:center;font-size:2.3rem;font-weight:900;position:relative;user-select:none;transition:.2s}
.drag .card{cursor:grab}.card.dragging{opacity:.5;transform:scale(.94)}.card.over{outline:4px dashed #94a3b8;outline-offset:4px}
.card.compare,.card.focus{transform:translateY(-10px);background:#fff4d6;border-color:var(--warn)}.card.sorted{background:#e7f7ec;border-color:var(--good)}.card.pivot{background:#fce7f3;border-color:var(--pivot)}
.card.bad{background:#fee2e2;border-color:var(--bad);animation:shake .38s}.tag{position:absolute;bottom:-27px;font-size:.65rem;color:var(--muted);font-weight:850;white-space:nowrap}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.msg,.explain{min-height:55px;padding:13px 15px;border-radius:10px;background:#eef2ff;border-left:5px solid var(--accent);font-weight:700;line-height:1.45}.msg.error{background:#fef2f2;border-color:var(--bad);color:#991b1b}.msg.ok{background:#f0fdf4;border-color:var(--good);color:#166534}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}.stat{text-align:center;padding:9px;border:1px solid var(--border);border-radius:10px;background:#f8fafc}.stat b{display:block;font-size:1.35rem}.stat span{font-size:.65rem;color:var(--muted);font-weight:800;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:11px}pre{white-space:pre-wrap;margin:0;font:.82rem/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.line{padding:2px 6px;border-radius:5px}.line.active{background:#fff1b8}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin:6px 0 10px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:.2s}
@media(max-width:760px){.grid{grid-template-columns:1fr}.card{width:61px;height:86px;font-size:1.65rem}.stats{grid-template-columns:repeat(2,1fr)}.board{gap:8px;min-height:165px}}
</style></head>
<body><header><h1>Sorting Algorithm Visualiser</h1><div class="sub">Watch and learn using <b>3, 5, 2, 3, 1</b>. Step through Bubble Sort, Selection Sort and Quick Sort.</div></header><main>
<section class="panel"><div class="controls"><label>Algorithm<select id="algo"><option value="bubble">Bubble Sort</option><option value="selection">Selection Sort</option><option value="quick">Quick Sort</option></select></label><label>Numbers<input id="numbers" value="3, 5, 2, 3, 1"></label><button id="apply">Use numbers</button><button id="random">Random set</button><label>Speed<select id="speed"><option value="1100">Slow</option><option value="650" selected>Normal</option><option value="300">Fast</option></select></label></div></section>
<section class="panel"><div id="board" class="board"></div><div class="legend"><span>🟨 Comparing</span><span>🟩 Sorted</span><span>🩷 Pivot</span></div><div id="explain" class="explain"></div>
<div class="stats"><div class="stat"><b id="comparisons">0</b><span>Comparisons / scans</span></div><div class="stat"><b id="swaps">0</b><span>Swaps</span></div><div class="stat"><b id="step">0</b><span>Step</span></div><div class="stat"><b id="status">Ready</b><span>Status</span></div></div>
<div class="controls" style="margin-top:11px"><button id="prev">← Previous</button><button id="next" class="primary">Next Step →</button><button id="play">▶ Play</button><button id="reset">Reset</button></div></section>
<section class="grid"><div class="panel"><h3>What the algorithm is doing</h3><div id="concept"></div></div><div class="panel"><h3>Pseudocode</h3><pre id="pseudo"></pre></div></section></main>
<script>
const $=x=>document.getElementById(x);let states=[],pos=0,timer=null;
const info={bubble:{concept:"<p><b>Bubble Sort</b> compares neighbours and swaps them when the left value is larger. Each pass moves the largest remaining value to the end.</p>",pseudo:["repeat for each pass","  compare neighbouring values","  if left > right","    swap them","mark end value sorted"]},selection:{concept:"<p><b>Selection Sort</b> scans the unsorted cards for the smallest value, then swaps it into the first unsorted position.</p>",pseudo:["for each unsorted position","  find smallest remaining value","  swap it into place","grow sorted section"]},quick:{concept:"<p><b>Quick Sort</b> uses the last value of each partition as the pivot, partitions the values, then repeats on the smaller partitions.</p>",pseudo:["choose pivot","compare values with pivot","move values ≤ pivot left","put pivot in final position","quicksort partitions"]}};
function S(a,t,c,w,cmp=[],sorted=[],pivot=null,line=0,status="Sorting"){return{a:[...a],t,c,w,cmp:[...cmp],sorted:[...sorted],pivot,line,status}}
function bubble(v){let a=[...v],s=[S(a,"Start with the cards.",0,0)],c=0,w=0,d=[];for(let e=a.length-1;e>0;e--){let ch=false;for(let i=0;i<e;i++){c++;s.push(S(a,`Compare ${a[i]} and ${a[i+1]}.`,c,w,[i,i+1],d,null,1));if(a[i]>a[i+1]){let x=a[i],y=a[i+1];[a[i],a[i+1]]=[a[i+1],a[i]];w++;ch=true;s.push(S(a,`${x} > ${y}, so swap.`,c,w,[i,i+1],d,null,3))}}d.push(e);if(!ch)break}d=[...a.keys()];s.push(S(a,"Finished.",c,w,[],d,null,0,"Done"));return s}
function selection(v){let a=[...v],s=[S(a,"Start by finding the smallest unsorted value.",0,0)],c=0,w=0,d=[];for(let i=0;i<a.length-1;i++){let m=i;for(let j=i+1;j<a.length;j++){c++;s.push(S(a,`Compare ${a[j]} with current smallest ${a[m]}.`,c,w,[m,j],d,null,1));if(a[j]<a[m])m=j}if(m!==i){let x=a[i],y=a[m];[a[i],a[m]]=[a[m],a[i]];w++;s.push(S(a,`Swap ${y} with ${x}.`,c,w,[i,m],d,null,2))}d.push(i)}d.push(a.length-1);s.push(S(a,"Finished.",c,w,[],d,null,0,"Done"));return s}
function quick(v){let a=[...v],s=[S(a,"Start Quick Sort.",0,0)],c=0,w=0,d=new Set();function q(lo,hi){if(lo>=hi){if(lo===hi)d.add(lo);return}let pv=a[hi],st=lo;s.push(S(a,`Choose ${pv} as pivot.`,c,w,[],[...d],hi,0));for(let j=lo;j<hi;j++){c++;s.push(S(a,`Compare ${a[j]} with pivot ${pv}.`,c,w,[j],[...d],hi,1));if(a[j]<=pv){if(j!==st){[a[j],a[st]]=[a[st],a[j]];w++;s.push(S(a,"Move value into left partition.",c,w,[j,st],[...d],hi,2))}st++}}if(st!==hi){[a[st],a[hi]]=[a[hi],a[st]];w++;s.push(S(a,`Put pivot ${pv} in final position.`,c,w,[st,hi],[...d],st,3))}d.add(st);q(lo,st-1);q(st+1,hi)}q(0,a.length-1);[...a.keys()].forEach(i=>d.add(i));s.push(S(a,"Finished.",c,w,[],[...d],null,0,"Done"));return s}
function renderPseudo(ls,n){$("pseudo").innerHTML=ls.map((x,i)=>`<div class="line ${i===n?"active":""}">${x.replaceAll("<","&lt;").replaceAll(">","&gt;")}</div>`).join("")}
function render(){let x=states[pos];$("board").innerHTML=x.a.map((v,i)=>`<div class="card ${x.sorted.includes(i)?"sorted ":""}${x.cmp.includes(i)?"compare ":""}${x.pivot===i?"pivot":""}">${v}<span class="tag">${x.pivot===i?"PIVOT":x.sorted.includes(i)?"SORTED":x.cmp.includes(i)?"CHECK":""}</span></div>`).join("");$("explain").textContent=x.t;$("comparisons").textContent=x.c;$("swaps").textContent=x.w;$("step").textContent=pos;$("status").textContent=x.status;renderPseudo(info[$("algo").value].pseudo,x.line);$("prev").disabled=pos===0;$("next").disabled=pos===states.length-1}
function stop(){if(timer){clearInterval(timer);timer=null;$("play").textContent="▶ Play"}}
function build(){stop();let v=$("numbers").value.split(",").map(x=>+x.trim()).filter(Number.isFinite);if(v.length<2||v.length>10)return alert("Enter 2–10 numbers.");let a=$("algo").value;states=a==="bubble"?bubble(v):a==="selection"?selection(v):quick(v);pos=0;$("concept").innerHTML=info[a].concept;render()}
$("next").onclick=()=>{stop();if(pos<states.length-1){pos++;render()}};$("prev").onclick=()=>{stop();if(pos>0){pos--;render()}};$("reset").onclick=()=>{stop();pos=0;render()};$("play").onclick=()=>{if(timer)return stop();if(pos===states.length-1)pos=0;$("play").textContent="⏸ Pause";timer=setInterval(()=>{if(pos<states.length-1){pos++;render()}else stop()},+$("speed").value)};$("apply").onclick=build;$("algo").onchange=build;$("random").onclick=()=>{$("numbers").value=Array.from({length:5},()=>1+Math.floor(Math.random()*9)).join(", ");build()};build();
</script></body></html>
