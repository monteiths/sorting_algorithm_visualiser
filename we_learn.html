<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorting Algorithms — We Learn</title><style>

:root{--purple:#651394;--purple2:#8a35b4;--ink:#262331;--muted:#6e6a75;--paper:#fbfafc;--line:#ddd7e2;--yellow:#fff1b8;--yellowLine:#c69210;--green:#dff5e9;--greenLine:#23855f;--pink:#f0ddf8;--bad:#fde2e2;--badLine:#c73535}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header,main{max-width:1080px;margin:auto;padding:18px}header{padding-bottom:7px}
.kicker{font-weight:900;color:var(--purple);letter-spacing:.04em;font-size:.82rem}
h1{color:var(--purple);font-size:clamp(1.7rem,4vw,2.65rem);margin:.3rem 0}.lead{color:var(--muted);line-height:1.5}
.rule{background:var(--purple);color:white;padding:18px;border-radius:10px;font-weight:900;letter-spacing:.03em;margin:14px 0}
.panel{background:white;border:1px solid #eee9f1;border-radius:13px;padding:16px;margin:12px 0;box-shadow:0 5px 20px rgba(52,35,66,.06)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px;font-size:.76rem;font-weight:900;color:var(--muted)}
select,input,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white}button{cursor:pointer;font-weight:800}
.primary{background:var(--purple);color:white;border-color:var(--purple)}button:disabled{opacity:.45;cursor:not-allowed}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:130px;padding:18px 4px 34px}
.card{width:74px;height:96px;border:2px solid #aaa5ae;border-radius:9px;background:#fff;display:grid;place-items:center;font-size:2.15rem;font-weight:900;position:relative;user-select:none}
.card.active{background:var(--yellow);border-color:var(--yellowLine);color:#8b6500}.card.finished{background:var(--green);border-color:var(--greenLine);color:#116444}
.card.pivot{background:var(--pink);border-color:var(--purple);color:var(--purple)}.card.bad{background:var(--bad);border-color:var(--badLine)}
.card[draggable=true]{cursor:grab}.tag{position:absolute;bottom:-24px;font-size:.63rem;color:var(--muted);font-weight:900;white-space:nowrap}
.msg{padding:13px 15px;border-left:5px solid var(--purple);background:#f5eef9;border-radius:8px;line-height:1.45;font-weight:700;min-height:50px}
.msg.good{background:#edf9f2;border-color:var(--greenLine);color:#155d43}.msg.bad{background:#fff0f0;border-color:var(--badLine);color:#8d2424}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.stat{text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px}.stat b{display:block;font-size:1.25rem}.stat small{color:var(--muted);font-weight:800}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.bin{min-height:125px;border:2px dashed var(--line);border-radius:10px;padding:10px;text-align:center}.bin h3{margin:0 0 8px;color:var(--purple);font-size:.86rem}.bin .cards{min-height:70px;padding:4px}
.stepbox{background:#faf7fc;border-radius:10px;padding:13px;margin:8px 0}.stepbox b{color:var(--purple)}
.cert{display:none;text-align:center;border:6px double var(--purple);padding:32px;background:white}.cert.show{display:block}
.progress{height:9px;background:#e8e3eb;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--purple)}
@media(max-width:650px){.card{width:58px;height:78px;font-size:1.65rem}.bins{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

.site-nav{display:flex;gap:10px;flex-wrap:wrap;max-width:1100px;margin:14px auto 0;padding:0 18px}

.site-nav a:hover{background:#f1e9fa}
</style></head><body>
<header><div class="kicker">TECHQUITY / COMPUTER SCIENCE / WE LEARN</div><h1>Sorting with five cards</h1><div class="lead">Start unsorted: <b>3, 5, 2, 3, 1</b>. Follow exactly the same routines as the teacher card resource.</div></header><nav class="site-nav">
<a href="index.html">Start Here</a>
<a href="we_learn.html">We Learn</a>
<a href="you_learn.html">You Learn</a>
<a href="lets_check_our_learning.html">Let's Check Our Learning</a>
</nav><main>
<div class="panel controls"><label>Algorithm<select id="alg"><option value="bubble">Bubble Sort</option><option value="selection">Selection Sort</option><option value="quick">Quick Sort</option></select></label><label id="pivotWrap" style="display:none">Pivot rule<select id="pivot"><option value="first">First card</option><option value="last">Last card</option><option value="middle">Middle position</option></select></label><button id="reset">Reset</button><button id="prev">← Previous</button><button id="next" class="primary">Next →</button></div>
<div id="rule" class="rule"></div><div class="panel"><div id="stage"></div><div id="msg" class="msg"></div><div class="stats"><div class="stat"><b id="c">0</b><small>Comparisons / scans</small></div><div class="stat"><b id="s">0</b><small>Pair swaps</small></div><div class="stat"><b id="p">0</b><small>Pass / round / partition</small></div><div class="stat"><b id="st">Ready</b><small>Status</small></div></div></div>
<div id="selftest" style="display:none"></div></main><script>

const START=[3,5,2,3,1];
const $=id=>document.getElementById(id);
function midIndex(n){return Math.floor((n-1)/2)} // left-middle for even groups, matching the guide
function pivotFor(arr,rule){return rule==="first"?arr[0]:rule==="last"?arr[arr.length-1]:arr[midIndex(arr.length)]}
function bubbleTrace(input){
 let a=[...input],steps=[],C=0,S=0,passes=0;
 for(let end=a.length-1;end>0;end--){
  let changed=false; passes++;
  for(let i=0;i<end;i++){
   C++; let before=[...a],swap=a[i]>a[i+1];
   if(swap){[a[i],a[i+1]]=[a[i+1],a[i]];S++;changed=true}
   steps.push({type:"bubble",i,j:i+1,swap,before,after:[...a],C,S,pass:passes,finishedFrom:end});
  }
  if(!changed)break;
 }
 return {steps,result:a,C,S,passes};
}
function selectionTrace(input){
 let a=[...input],steps=[],C=0,S=0,rounds=0;
 for(let pos=0;pos<a.length-1;pos++){
  rounds++; let min=pos;
  // Explicitly show the first unsorted card being marked as the starting minimum.
  // This is not counted as a scan/comparison.
  steps.push({type:"selstart",pos,min,C,S,round:rounds,state:[...a]});
  for(let j=pos+1;j<a.length;j++){
   C++; let old=min;if(a[j]<a[min])min=j;
   steps.push({type:"scan",pos,j,oldMin:old,min,C,S,round:rounds,state:[...a]});
  }
  if(min!==pos){let before=[...a];[a[pos],a[min]]=[a[min],a[pos]];S++;steps.push({type:"selswap",pos,min,before,after:[...a],C,S,round:rounds})}
  steps.push({type:"selfixed",pos,state:[...a],C,S,round:rounds});
 }
 return {steps,result:a,C,S,rounds};
}
function quickTrace(input,rule){
 let scans=0,parts=0,events=[];
 function q(arr,path="whole"){
  if(arr.length<=1)return [...arr];
  let pivot=pivotFor(arr,rule),less=[],equal=[],greater=[];parts++;
  events.push({type:"partitionStart",arr:[...arr],pivot,path,parts,scans});
  arr.forEach((v,idx)=>{
   scans++;
   let group=v<pivot?"less":v>pivot?"greater":"equal";
   if(group==="less")less.push(v);else if(group==="greater")greater.push(v);else equal.push(v);
   events.push({type:"classify",arr:[...arr],pivot,value:v,index:idx,group,less:[...less],equal:[...equal],greater:[...greater],parts,scans,path});
  });
  let L=q(less,path+".L"),G=q(greater,path+".G");
  let joined=[...L,...equal,...G];events.push({type:"join",pivot,path,joined:[...joined],parts,scans});
  return joined;
 }
 let result=q([...input]);return {events,result,scans,parts};
}
function eq(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function selfTests(){
 let failures=[];
 let b=bubbleTrace(START);
 if(!eq(b.result,[1,2,3,3,5]))failures.push("bubble result");
 if(b.C!==10||b.S!==7||b.passes!==4)failures.push(`bubble counts ${b.C}/${b.S}/${b.passes}`);
 if(!(b.steps[0].i===0&&b.steps[0].j===1&&!b.steps[0].swap))failures.push("bubble first comparison");
 let s=selectionTrace(START);
 if(!eq(s.result,[1,2,3,3,5])||s.C!==10||s.S!==4||s.rounds!==4)failures.push("selection trace");
 let q1=quickTrace(START,"first"),ql=quickTrace(START,"last"),qm=quickTrace(START,"middle");
 if(!eq(q1.result,[1,2,3,3,5])||q1.scans!==7||q1.parts!==2)failures.push("quick first");
 if(!eq(ql.result,[1,2,3,3,5])||ql.scans!==9||ql.parts!==2)failures.push("quick last");
 if(!eq(qm.result,[1,2,3,3,5])||qm.scans!==10||qm.parts!==3)failures.push("quick middle");
 if(pivotFor(START,"middle")!==2)failures.push("middle pivot");
 return failures;
}

</script><script>
let idx=-1,trace=null;
function cards(arr,active=[],finished=[],pivotIndex=null){return `<div class="cards">${arr.map((v,i)=>`<div class="card ${active.includes(i)?"active":""} ${finished.includes(i)?"finished":""} ${pivotIndex===i?"pivot":""}">${v}</div>`).join("")}</div>`}
function reset(){idx=-1;let alg=$("alg").value;$("pivotWrap").style.display=alg==="quick"?"grid":"none";trace=alg==="bubble"?bubbleTrace(START):alg==="selection"?selectionTrace(START):quickTrace(START,$("pivot").value);render()}
function render(){
 let alg=$("alg").value,stage=$("stage");$("prev").disabled=idx<0;

 if(alg==="bubble"){
   $("rule").textContent="COMPARE NEIGHBOURS → SWAP IF NEEDED → MOVE RIGHT";
   if(idx>=trace.steps.length){
     stage.innerHTML=cards(trace.result,[],[0,1,2,3,4]);
     $("c").textContent=trace.C;$("s").textContent=trace.S;$("p").textContent=trace.passes;
     $("msg").textContent="Bubble Sort complete: 1, 2, 3, 3, 5. All cards are now finished.";
     $("st").textContent="Complete";
     return;
   }
   let e=idx<0?null:trace.steps[idx],arr=e?e.after:START,active=e?[e.i,e.j]:[],finished=[];
   if(e){
     let next=trace.steps[idx+1];
     if(!next||next.pass!==e.pass)finished=Array.from({length:START.length-e.finishedFrom},(_,k)=>e.finishedFrom+k);
   }
   stage.innerHTML=cards(arr,active,finished);
   $("c").textContent=e?e.C:0;$("s").textContent=e?e.S:0;$("p").textContent=e?e.pass:0;
   $("msg").textContent=e?`Pass ${e.pass}: compare ${e.before[e.i]} / ${e.before[e.j]} — ${e.swap?"swap":"keep"}. Then move right.`:"Start at the left: compare 3 and 5.";
   $("st").textContent="Watching";

 }else if(alg==="selection"){
   $("rule").textContent="MARK MINIMUM → SCAN REMAINING VALUES → SWAP ONCE";
   if(idx>=trace.steps.length){
     stage.innerHTML=cards(trace.result,[],[0,1,2,3,4]);
     $("c").textContent=trace.C;$("s").textContent=trace.S;$("p").textContent=trace.rounds;
     $("msg").textContent="Selection Sort complete: 1, 2, 3, 3, 5. All positions are now finished.";
     $("st").textContent="Complete";
     return;
   }
   let e=idx<0?null:trace.steps[idx],arr=e?(e.after||e.state):START,active=[],fin=[];
   if(e){
     if(e.type==="selstart") active=[e.min];
     if(e.type==="scan") active=e.min===e.j?[e.j]:[e.min,e.j];
     if(e.type==="selswap") active=[e.pos,e.min];
     if(e.type==="selfixed") fin=Array.from({length:e.pos+1},(_,k)=>k);
   }
   stage.innerHTML=cards(arr,active,fin);
   $("c").textContent=e?e.C:0;$("s").textContent=e?e.S:0;$("p").textContent=e?e.round:0;
   if(!e){
     $("msg").textContent="Round 1: mark 3 as the starting minimum. Scan every remaining card from left to right: 5, 2, 3, 1.";
   }else if(e.type==="selstart"){
     $("msg").textContent=`Round ${e.round}: mark ${e.state[e.min]} as the starting minimum. This is not counted as a scan.`;
   }else if(e.type==="scan"){
     const candidate=e.state[e.j];
     $("msg").textContent=`Round ${e.round}: scan ${candidate}. ${e.min===e.j?candidate+" becomes the new minimum.":"It is not smaller than the current minimum. Keep scanning."}`;
   }else if(e.type==="selswap"){
     $("msg").textContent=`Round ${e.round}: scan complete. Swap the minimum ${e.before[e.min]} into the first unsorted position.`;
   }else{
     $("msg").textContent=`Round ${e.round} complete. Position ${e.pos+1} is finished.`;
   }
   $("st").textContent="Watching";

 }else{
   $("rule").textContent="CHOOSE PIVOT → PARTITION LEFT TO RIGHT → SORT OUTER GROUPS → JOIN";
   if(idx>=trace.events.length){
     stage.innerHTML=cards(trace.result,[],[0,1,2,3,4]);
     $("c").textContent=trace.scans;$("s").textContent=0;$("p").textContent=trace.parts;
     $("msg").textContent=`Quick Sort complete: ${trace.result.join(", ")}.`;
     $("st").textContent="Complete";
     return;
   }
   let e=idx<0?null:trace.events[idx];
   let base=e ? (e.type==="join" ? e.joined : (e.arr||START)) : START;
   let pv=e?.pivot??pivotFor(START,$("pivot").value);
   let pivotIndex=null;
   if(!e){
     pivotIndex=$("pivot").value==="first"?0:$("pivot").value==="last"?START.length-1:midIndex(START.length);
   }else if(e.type==="partitionStart"||e.type==="classify"){
     pivotIndex=$("pivot").value==="first"?0:$("pivot").value==="last"?e.arr.length-1:midIndex(e.arr.length);
   }
   let bins=e&&e.type==="classify"?`<div class="bins"><div class="bin"><h3>LESS than ${pv}</h3>${cards(e.less)}</div><div class="bin"><h3>EQUAL to ${pv}</h3>${cards(e.equal)}</div><div class="bin"><h3>GREATER than ${pv}</h3>${cards(e.greater)}</div></div>`:"";
   stage.innerHTML=`${cards(base,e&&e.type==="classify"?[e.index]:[],[],pivotIndex)}${bins}`;
   $("c").textContent=e?e.scans:0;$("s").textContent=0;$("p").textContent=e?e.parts:0;
   $("msg").textContent=!e?`Choose the ${$("pivot").value} pivot (${pv}). The pivot is not moved. Scan the group from left to right and classify each card into LESS / EQUAL / GREATER.`:e.type==="partitionStart"?`New group: choose pivot ${e.pivot}. Do not move it; begin classifying from the left.`:e.type==="classify"?`Scan ${e.value}: place it in ${e.group.toUpperCase()}. Order of arrival is preserved.`:`Join sorted less + equal + sorted greater: ${e.joined.join(", ")}.`;
   $("st").textContent="Watching";
 }
}
$("next").onclick=()=>{let n=$("alg").value==="quick"?trace.events.length:trace.steps.length;if(idx<n)idx++;render()};$("prev").onclick=()=>{if(idx>=0)idx--;render()};$("reset").onclick=reset;$("alg").onchange=reset;$("pivot").onchange=reset;reset();
let f=selfTests();if(location.search.includes("selftest")){$("selftest").style.display="block";$("selftest").textContent=f.length?"SELFTEST FAIL: "+f.join(", "):"SELFTEST PASS";}
</script></body></html>
