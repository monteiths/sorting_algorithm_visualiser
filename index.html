<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorting — Watch & Learn</title><link rel="stylesheet" href="sorting.css"></head><body>
<header><div class="kicker">TECHQUITY / COMPUTER SCIENCE / WATCH & LEARN</div><h1>Sorting with five cards</h1><div class="lead">Start unsorted: <b>3, 5, 2, 3, 1</b>. Follow exactly the same routines as the teacher card resource.</div></header><main>
<div class="panel controls"><label>Algorithm<select id="alg"><option value="bubble">Bubble Sort</option><option value="selection">Selection Sort</option><option value="quick">Quick Sort</option></select></label><label id="pivotWrap" style="display:none">Pivot rule<select id="pivot"><option value="first">First card</option><option value="last">Last card</option><option value="middle">Middle position</option></select></label><button id="reset">Reset</button><button id="prev">← Previous</button><button id="next" class="primary">Next →</button></div>
<div id="rule" class="rule"></div><div class="panel"><div id="stage"></div><div id="msg" class="msg"></div><div class="stats"><div class="stat"><b id="c">0</b><small>Comparisons / scans</small></div><div class="stat"><b id="s">0</b><small>Pair swaps</small></div><div class="stat"><b id="p">0</b><small>Pass / round / partition</small></div><div class="stat"><b id="st">Ready</b><small>Status</small></div></div></div>
<div id="selftest" style="display:none"></div></main><script src="sorting.js"></script><script>
let idx=-1,trace=null;
function cards(arr,active=[],finished=[],pivot=null){return `<div class="cards">${arr.map((v,i)=>`<div class="card ${active.includes(i)?"active":""} ${finished.includes(i)?"finished":""} ${pivot===v?"pivot":""}">${v}</div>`).join("")}</div>`}
function reset(){idx=-1;let alg=$("alg").value;$("pivotWrap").style.display=alg==="quick"?"grid":"none";trace=alg==="bubble"?bubbleTrace(START):alg==="selection"?selectionTrace(START):quickTrace(START,$("pivot").value);render()}
function render(){
 let alg=$("alg").value,stage=$("stage");$("prev").disabled=idx<0;
 if(alg==="bubble"){
  $("rule").textContent="COMPARE NEIGHBOURS → SWAP IF NEEDED → MOVE RIGHT";
  let e=idx<0?null:trace.steps[idx],arr=e?e.after:START,active=e?[e.i,e.j]:[],finished=[];
  if(e){let next=trace.steps[idx+1];if(!next||next.pass!==e.pass)finished=Array.from({length:START.length-e.finishedFrom},(_,k)=>e.finishedFrom+k);}
  stage.innerHTML=cards(arr,active,finished);$("c").textContent=e?e.C:0;$("s").textContent=e?e.S:0;$("p").textContent=e?e.pass:0;
  $("msg").textContent=e?`Pass ${e.pass}: compare ${e.before[e.i]} / ${e.before[e.j]} — ${e.swap?"swap":"keep"}. Then move right.`:"Start at the left: compare 3 and 5.";
  $("st").textContent=idx===trace.steps.length-1?"Complete":"Watching";
 }else if(alg==="selection"){
  $("rule").textContent="MARK MINIMUM → SCAN REMAINING VALUES → SWAP ONCE";
  let e=idx<0?null:trace.steps[idx],arr=e?(e.after||e.state):START,active=[],fin=[];
  if(e){if(e.type==="scan")active=[e.min,e.j];if(e.type==="selswap")active=[e.pos,e.min];if(e.type==="selfixed")fin=Array.from({length:e.pos+1},(_,k)=>k)}
  stage.innerHTML=cards(arr,active,fin);$("c").textContent=e?e.C:0;$("s").textContent=e?e.S:0;$("p").textContent=e?e.round:0;
  $("msg").textContent=!e?"Round 1: mark 3 as the starting minimum, then scan 5, 2, 3, 1.":e.type==="scan"?`Round ${e.round}: scan candidate ${e.state[e.j]}. ${e.min===e.j?"It becomes the new minimum.":"Keep the current minimum."}`:e.type==="selswap"?`Scan complete: swap the minimum ${e.before[e.min]} into the first unsorted position.`:`Position ${e.pos+1} is finished.`;
  $("st").textContent=idx===trace.steps.length-1?"Complete":"Watching";
 }else{
  $("rule").textContent="CHOOSE PIVOT → PARTITION LEFT TO RIGHT → SORT OUTER GROUPS → JOIN";
  let e=idx<0?null:trace.events[idx],base=e?.arr||START,pv=e?.pivot??pivotFor(START,$("pivot").value);
  let bins=e&&e.type==="classify"?`<div class="bins"><div class="bin"><h3>LESS than ${pv}</h3>${cards(e.less)}</div><div class="bin"><h3>EQUAL to ${pv}</h3>${cards(e.equal,[],[],pv)}</div><div class="bin"><h3>GREATER than ${pv}</h3>${cards(e.greater)}</div></div>`:"";
  stage.innerHTML=`${cards(base,e&&e.type==="classify"?[e.index]:[],[],pv)}${bins}`;
  $("c").textContent=e?e.scans:0;$("s").textContent=0;$("p").textContent=e?e.parts:0;
  $("msg").textContent=!e?`Choose the ${$("pivot").value} pivot (${pv}). The pivot is not moved. Scan the group from left to right and classify each card into LESS / EQUAL / GREATER.`:e.type==="partitionStart"?`New group: choose pivot ${e.pivot}. Do not move it; begin classifying from the left.`:e.type==="classify"?`Scan ${e.value}: place it in ${e.group.toUpperCase()}. Order of arrival is preserved.`:`Join sorted less + equal + sorted greater: ${e.joined.join(", ")}.`;
  $("st").textContent=idx===trace.events.length-1?"Complete":"Watching";
 }
}
$("next").onclick=()=>{let n=$("alg").value==="quick"?trace.events.length:trace.steps.length;if(idx<n-1)idx++;render()};$("prev").onclick=()=>{if(idx>=0)idx--;render()};$("reset").onclick=reset;$("alg").onchange=reset;$("pivot").onchange=reset;reset();
let f=selfTests();if(location.search.includes("selftest")){$("selftest").style.display="block";$("selftest").textContent=f.length?"SELFTEST FAIL: "+f.join(", "):"SELFTEST PASS";}
</script></body></html>
