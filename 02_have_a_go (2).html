<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorting Visualiser — Have a Go</title>
<style>
:root{--ink:#172033;--muted:#64748b;--paper:#f7f8fb;--accent:#635bff;--good:#16a34a;--bad:#dc2626;--warn:#f59e0b;--pivot:#db2777;--border:#dfe3eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--paper);color:var(--ink)}
header,main{max-width:1120px;margin:auto}header{padding:17px 14px 9px}main{padding:0 14px 18px}
h1{margin:0 0 5px;font-size:clamp(1.5rem,3vw,2.25rem);letter-spacing:-.04em}.sub,.small{color:var(--muted);line-height:1.45}
.panel{background:#fff;border:1px solid var(--border);border-radius:15px;padding:15px;margin-bottom:11px;box-shadow:0 8px 24px rgba(23,32,51,.08)}
.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:end}label{display:grid;gap:4px;font-size:.78rem;font-weight:800;color:var(--muted)}
select,button{font:inherit;border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:#fff;color:var(--ink)}
button{cursor:pointer;font-weight:750}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.4;cursor:not-allowed}
.board{min-height:220px;display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap;padding:32px 8px 44px}
.card{width:96px;height:126px;border:3px solid var(--accent);border-radius:16px;background:#f0efff;display:grid;place-items:center;font-size:2.5rem;font-weight:900;position:relative;cursor:grab;user-select:none;transition:.2s}
.card.compare{background:#fff4d6;border-color:var(--warn)}.card.pivot{background:#fce7f3;border-color:var(--pivot)}
.card.sorted{background:#dcfce7;border-color:var(--good)}.card.bad{background:#fee2e2;border-color:var(--bad);animation:shake .4s}
.tag{position:absolute;bottom:-28px;font-size:.65rem;color:var(--muted);font-weight:850;white-space:nowrap}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.msg{min-height:64px;padding:14px 16px;border-radius:10px;background:#eef2ff;border-left:5px solid var(--accent);font-weight:750;line-height:1.45}
.msg.error{background:#fef2f2;border-color:var(--bad);color:#991b1b}.msg.ok{background:#f0fdf4;border-color:var(--good);color:#166534}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}.stat{text-align:center;padding:9px;border:1px solid var(--border);border-radius:10px;background:#f8fafc}.stat b{display:block;font-size:1.35rem}.stat span{font-size:.65rem;color:var(--muted);font-weight:800;text-transform:uppercase}
.actionrow{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:-20px 0 15px}
@media(max-width:700px){.board{gap:8px;min-height:170px}.card{width:61px;height:88px;font-size:1.7rem}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1>Sorting Algorithm Visualiser</h1><div class="sub">Have a go using <b>3, 5, 2, 3, 1</b>. Follow the algorithm one decision at a time.</div></header>
<main>
<section class="panel">
<div class="controls">
<label>Algorithm
<select id="algo"><option value="bubble">Bubble Sort</option><option value="selection">Selection Sort</option><option value="quick">Quick Sort</option></select>
</label>
<label id="pw" style="display:none">Quick Sort pivot
<select id="pivot"><option value="first">First</option><option value="middle">Middle</option><option value="last" selected>Last</option></select>
</label>
<button id="reset" class="primary">↺ Reset to 3, 5, 2, 3, 1</button>
<button id="hint">Show Hint</button>
</div>
</section>

<section class="panel">
<div id="board" class="board"></div>
<div class="actionrow"><button id="noswap">No swap needed →</button></div>
<div id="msg" class="msg"></div>
<div class="stats">
<div class="stat"><b id="moves">0</b><span>Swaps</span></div>
<div class="stat"><b id="errors">0</b><span>Invalid moves</span></div>
<div class="stat"><b id="comparisons">0</b><span>Comparisons</span></div>
<div class="stat"><b id="status">Ready</b><span>Status</span></div>
</div>
</section>
<section class="panel small" id="help"></section>
</main>

<script>
const O=[3,5,2,3,1], $=x=>document.getElementById(x);
let a=[], steps=[], s=0, swaps=0, errors=0, comparisons=0, from=null;

function sw(x,i,j){[x[i],x[j]]=[x[j],x[i]]}
function pivotIndex(lo,hi,mode){return mode==="first"?lo:mode==="middle"?Math.floor((lo+hi)/2):hi}

function bubbleSteps(input){
 let x=[...input], out=[];
 for(let end=x.length-1;end>0;end--){
   let changed=false;
   for(let i=0;i<end;i++){
     const left=x[i], right=x[i+1], need=left>right;
     out.push({kind:"compare",i,j:i+1,needSwap:need,
       text:need?`Moving left to right: compare ${left} and ${right}. ${left} > ${right}, so swap them, then move one pair to the right.`:
                 `Moving left to right: compare ${left} and ${right}. ${left} ≤ ${right}, so no swap is needed; then move one pair to the right.`});
     if(need){sw(x,i,i+1);changed=true}
   }
   out.push({kind:"pass",sortedFrom:end,text:`Pass complete. ${x[end]} is now fixed in its sorted position.`});
   if(!changed)break;
 }
 return out;
}

function selectionSteps(input){
 let x=[...input],out=[];
 for(let pos=0;pos<x.length-1;pos++){
   let min=pos;
   for(let j=pos+1;j<x.length;j++){
     out.push({kind:"scan",i:min,j,needSwap:false,
       text:`Scan the unsorted section: compare ${x[min]} with ${x[j]}. ${x[j]<x[min]?`${x[j]} becomes the new smallest value.`:`${x[min]} remains the smallest value.`}`});
     if(x[j]<x[min])min=j;
   }
   if(min!==pos){
     out.push({kind:"selectswap",i:pos,j:min,needSwap:true,
       text:`The smallest remaining value is ${x[min]}. Swap it into position ${pos+1}.`});
     sw(x,pos,min);
   }
   out.push({kind:"fixed",sortedTo:pos,text:`Position ${pos+1} is now fixed.`});
 }
 return out;
}

function quickSteps(input,mode){
 let x=[...input],out=[];
 function q(lo,hi){
   if(lo>=hi)return;
   const pi=pivotIndex(lo,hi,mode), pv=x[pi];
   out.push({kind:"pivot",pivotValue:pv,lo,hi,text:`Use ${pv} as the pivot value for this partition.`});
   let i=lo,j=hi;
   while(i<=j){
     while(x[i]<pv){
       out.push({kind:"qcompare",i,i2:i,pivotValue:pv,needSwap:false,text:`${x[i]} < pivot ${pv}, so it is correctly on the left. Move the left pointer on.`});
       i++;
     }
     while(x[j]>pv){
       out.push({kind:"qcompare",i:j,i2:j,pivotValue:pv,needSwap:false,text:`${x[j]} > pivot ${pv}, so it is correctly on the right. Move the right pointer on.`});
       j--;
     }
     if(i<=j){
       if(i<j){
         out.push({kind:"qswap",i,j,pivotValue:pv,needSwap:true,text:`Swap ${x[i]} and ${x[j]} to continue partitioning around pivot ${pv}.`});
         sw(x,i,j);
       } else {
         out.push({kind:"qcompare",i,i2:i,pivotValue:pv,needSwap:false,text:`The pointers meet at ${x[i]}. No swap is needed.`});
       }
       i++;j--;
     }
   }
   q(lo,j); q(i,hi);
 }
 q(0,x.length-1);
 return out;
}

function makeSteps(){
 const alg=$("algo").value;
 return alg==="bubble"?bubbleSteps(O):alg==="selection"?selectionSteps(O):quickSteps(O,$("pivot").value);
}
function actionable(){
 while(steps[s] && ["pass","fixed","pivot"].includes(steps[s].kind)){
   $("msg").className="msg ok"; $("msg").textContent=steps[s].text; s++;
 }
 return steps[s];
}
function reset(){
 a=[...O];steps=makeSteps();s=swaps=errors=comparisons=0;
 $("msg").className="msg";$("msg").textContent=$("algo").value==="bubble"?
 "Bubble Sort: start at the LEFT. Compare 3 and 5 first, then move one pair to the RIGHT after each decision.":
 $("algo").value==="selection"?"Selection Sort starts at the first unsorted position and scans for the smallest value.":
 "Quick Sort: use the selected pivot rule to partition the cards.";
 render();
}
function render(){
 let c=actionable();
 let sortedFrom=-1, sortedTo=-1;
 // Derive completed bubble suffix / selection prefix from completed marker steps.
 for(let k=0;k<s;k++){if(steps[k].kind==="pass")sortedFrom=Math.max(sortedFrom,steps[k].sortedFrom);if(steps[k].kind==="fixed")sortedTo=Math.max(sortedTo,steps[k].sortedTo)}
 $("board").innerHTML=a.map((v,i)=>{
   let cls="card",tag="";
   if(c && (i===c.i||i===c.j||i===c.i2)) cls+=" compare";
   if(c && c.pivotValue!==undefined && v===c.pivotValue){cls+=" pivot";tag="PIVOT VALUE"}
   if($("algo").value==="bubble" && sortedFrom>=0 && i>=sortedFrom) cls+=" sorted";
   if($("algo").value==="selection" && sortedTo>=0 && i<=sortedTo) cls+=" sorted";
   if(c && $("algo").value==="bubble" && (i===c.i||i===c.j)) tag = i===c.i ? "LEFT" : "RIGHT";
   return `<div draggable="true" data-i="${i}" class="${cls}">${v}<span class="tag">${tag}</span></div>`;
 }).join("");
 $("moves").textContent=swaps;$("errors").textContent=errors;$("comparisons").textContent=comparisons;
 $("status").textContent=c?"Working":"Complete";
 $("noswap").disabled=!c || !!c.needSwap;
 $("noswap").style.display=(c && !c.needSwap)?"inline-block":"none";
 if(c && $("msg").classList.contains("ok")===false && $("msg").classList.contains("error")===false) $("msg").textContent=c.text;
 if(!c){$("msg").className="msg ok";$("msg").textContent=`Correct — sorted: ${a.join(", ")}.`}
 bind();
}
function noSwap(){
 let c=actionable();if(!c)return;
 if(c.needSwap){bad(c.i,c.j,"Invalid operation — these cards need to be swapped.");return}
 comparisons++;s++;$("msg").className="msg ok";$("msg").textContent="Correct — no swap needed.";render();
}
function attempt(i,j){
 let c=actionable();if(!c)return;
 if(!c.needSwap){bad(i,j,"Invalid operation — this comparison does not require a swap. Click “No swap needed”.");return}
 if((i===c.i&&j===c.j)||(i===c.j&&j===c.i)){
   sw(a,c.i,c.j);swaps++;comparisons++;s++;
   $("msg").className="msg ok";$("msg").textContent="Correct swap.";render();
 }else bad(i,j,"Invalid operation — those are not the cards the algorithm should swap at this step.");
}
function bad(i,j,t){
 errors++;$("errors").textContent=errors;$("msg").className="msg error";$("msg").textContent=t;
 document.querySelectorAll(".card").forEach(x=>{let n=+x.dataset.i;if(n===i||n===j){x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),430)}})
}
function bind(){
 document.querySelectorAll(".card").forEach(x=>{
   x.ondragstart=()=>from=+x.dataset.i;
   x.ondragover=e=>e.preventDefault();
   x.ondrop=e=>{e.preventDefault();let j=+x.dataset.i;if(from!==null&&from!==j)attempt(from,j);from=null}
 })
}
$("algo").onchange=()=>{$("pw").style.display=$("algo").value==="quick"?"grid":"none";$("help").innerHTML=$("algo").value==="bubble"?
 "<b>Bubble Sort:</b> compare adjacent cards from left to right. Swap only when the left value is greater. The first comparison here is <b>3 and 5</b>, so no swap is needed.":
 $("algo").value==="selection"?"<b>Selection Sort:</b> scan the unsorted section to identify the smallest value, then swap it into the first unsorted position.":
 "<b>Quick Sort:</b> use the chosen First/Middle/Last value as the pivot reference. There is no artificial pivot-to-end setup swap.";reset()};
$("pivot").onchange=reset;$("reset").onclick=reset;$("noswap").onclick=noSwap;
$("hint").onclick=()=>{let c=actionable();if(!c)return;$("msg").className="msg";$("msg").textContent=c.needSwap?`Hint: swap positions ${c.i+1} and ${c.j+1}. ${c.text}`:`Hint: no swap is needed. ${c.text}`};
$("algo").dispatchEvent(new Event("change"));
</script>
</body></html>
